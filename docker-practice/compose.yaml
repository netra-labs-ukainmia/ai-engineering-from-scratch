services:
  ai-dev:
    image: ai-dev-cpu
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace
    command: >
      jupyter notebook --ip=0.0.0.0 --port=8888
      --no-browser --allow-root

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: